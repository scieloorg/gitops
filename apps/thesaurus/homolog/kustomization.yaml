apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

namespace: hml-thesaurus

namePrefix: thesaurus-

replicas:
  - name: thesaurus
    count: 1

images:
  - name: infrascielo/thesaurus
    newName: infrascielo/thesaurus
    digest: sha256:3c7ae7baca5438cd122431fda3778a33fcb4fbed90beff3095df1409e3327470

# JSON patch só para Service
patches:
  - target:
      kind: Service
      name: thesaurus-svc
    patch: |
      - op: replace
        path: /spec/ports/0/nodePort
        value: 32652

# Strategic merge para Deployment
patchesStrategicMerge:
  - patch-deployment.yaml
