apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

namespace: hml-thesaurus

namePrefix: thesaurus-

replicas:
  - name: thesaurus
    count: 1

images:
  - name: infrascielo/thesaurus
    newName: infrascielo/thesaurus
    digest: sha256:1366df57338d15a6f292287b4b1b85e9f645a6d695ffbb72bd2f8566fcc2a36b

# JSON patch só para Service
patches:
  - target:
      kind: Service
      name: thesaurus-svc
    patch: |
      - op: replace
        path: /spec/ports/0/nodePort
        value: 32652

# Strategic merge para Deployment
patchesStrategicMerge:
  - patch-deployment.yaml
