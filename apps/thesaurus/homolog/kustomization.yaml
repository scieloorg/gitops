apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

namespace: hml-thesaurus

namePrefix: thesaurus-

replicas:
  - name: thesaurus
    count: 1

images:
  - name: infrascielo/thesaurus
    newName: infrascielo/thesaurus
    digest: sha256:0f92df116e693a07b8216546ead3bb168b26239bd5259fd3895f4af5141e08c4

# JSON patch só para Service
patches:
  - target:
      kind: Service
      name: thesaurus-svc
    patch: |
      - op: replace
        path: /spec/ports/0/nodePort
        value: 32652

# Strategic merge para Deployment
patchesStrategicMerge:
  - patch-deployment.yaml
