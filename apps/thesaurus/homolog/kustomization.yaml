apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

namespace: hml-thesaurus

namePrefix: thesaurus-

replicas:
  - name: thesaurus
    count: 1

images:
  - name: infrascielo/thesaurus
    newName: infrascielo/thesaurus
    digest: sha256:5293a27a973d6528e822fd3dec20f198b802f6914f3e18d8d3bc160f6a52d205

# JSON patch só para Service
patches:
  - target:
      kind: Service
      name: thesaurus-svc
    patch: |
      - op: replace
        path: /spec/ports/0/nodePort
        value: 32652

# Strategic merge para Deployment
patchesStrategicMerge:
  - patch-deployment.yaml
